name: Backend tests

on:
  pull_request:
    paths:
      - "backend/**"
      # phone ke rules backend/data/phone_rules.json se match hone chahiye
      - "FraudGuardExpo/modules/expo-call-guard/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - "FraudGuardExpo/modules/expo-call-guard/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Tests kabhi Gemini call nahi karte; module import ke liye sirf koi value chahiye.
      GEMINI_API_KEY: ci-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Rule engine and number screening
        run: |
          python -m tests.test_pattern_matcher
          python -m tests.test_number_screening
          python -m tests.test_group_messages
      - name: Detection accuracy, /v1 API and phone rules
        run: python -m unittest tests.test_detection_accuracy tests.test_api_v1 tests.test_phone_rules tests.test_mailer
